[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senpai-bot"
version = "0.1.1"
description = "Local Windows Python IDE and Ollama-powered tutor"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8.3,<9"]

[project.scripts]
senpai-bot = "senpai_bot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
