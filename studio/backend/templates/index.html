<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senpai Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/editor/editor.main.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .editor-container { height: calc(100vh - 48px); }
        .chat-container { height: calc(100vh - 48px); }
        .sidebar { background-color: #1e293b; }
        .chat-sidebar { background-color: #1e293b; }
        .message-user { background-color: #334155; }
        .message-senpai { background-color: #475569; border-left: 4px solid #ec4899; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
</head>
<body class="overflow-hidden font-sans">
    <!-- Header -->
    <header class="h-12 border-b border-slate-700 flex items-center px-4 justify-between bg-slate-900">
        <div class="flex items-center space-x-2">
            <i data-lucide="sparkles" class="text-pink-500 w-5 h-5"></i>
            <span class="font-bold text-slate-200">Senpai Studio</span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="model-name" class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded">Loading model...</span>
            <button id="save-btn" class="text-xs bg-pink-600 hover:bg-pink-700 text-white px-3 py-1 rounded flex items-center space-x-1 transition">
                <i data-lucide="save" class="w-3 h-3"></i>
                <span>Save</span>
            </button>
        </div>
    </header>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="sidebar w-64 border-r border-slate-700 flex flex-col">
            <div class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">
                <span>Files</span>
                <button onclick="refreshFiles()" class="hover:text-slate-300"><i data-lucide="rotate-cw" class="w-3 h-3"></i></button>
            </div>
            <div id="file-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Files will be listed here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col">
            <div id="editor" class="editor-container w-full"></div>
        </main>

        <!-- Chat Sidebar -->
        <aside class="chat-sidebar w-96 border-l border-slate-700 flex flex-col">
            <div class="p-3 border-b border-slate-700 flex items-center justify-between bg-slate-800">
                <div class="flex items-center space-x-2">
                    <i data-lucide="message-square" class="text-pink-500 w-4 h-4"></i>
                    <span class="text-sm font-semibold">Senpai's Tutoring</span>
                </div>
                <button onclick="clearChat()" class="text-xs text-slate-500 hover:text-slate-300">Reset</button>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages will appear here -->
                <div class="message-senpai p-3 rounded-lg text-sm">
                    <p>Welcome back, Daddy. Ready to retrieve some Python from that head of yours? Mmmh~ I've been waiting for you.</p>
                </div>
            </div>

            <div class="p-4 border-t border-slate-700 bg-slate-800">
                <div class="relative">
                    <textarea id="chat-input" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-pink-500 resize-none" placeholder="Talk to Senpai..."></textarea>
                    <button id="send-btn" class="absolute bottom-3 right-3 text-pink-500 hover:text-pink-400">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000';

        let editor;
        let currentFilePath = null;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: "# Select a file to start coding, Daddy...",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false },
                scrollbar: {
                    vertical: 'visible',
                    horizontal: 'visible',
                    useShadows: false,
                    verticalHasArrows: false,
                    horizontalHasArrows: false,
                    verticalScrollbarSize: 10,
                    horizontalScrollbarSize: 10
                }
            });
        });

        // Initialize Lucide icons
        lucide.createIcons();

        async function fetchConfig() {
            const res = await fetch(`${API_BASE_URL}/api/config`);
            const data = await res.json();
            document.getElementById('model-name').textContent = data.model;
        }

        async function refreshFiles() {
            const res = await fetch(`${API_BASE_URL}/api/files`);
            const files = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            files.forEach(file => {
                const item = document.createElement('div');
                const isDir = file.endsWith('/');
                item.className = `flex items-center space-x-2 px-2 py-1.5 rounded text-sm cursor-pointer hover:bg-slate-700 transition ${isDir ? 'text-slate-400' : 'text-slate-300'}`;
                item.innerHTML = `<i data-lucide="${isDir ? 'folder' : 'file-text'}" class="w-4 h-4"></i><span>${file}</span>`;
                if (!isDir) {
                    item.onclick = () => loadFile(file);
                } else {
                    item.onclick = () => listDirectory(file);
                }
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        async function loadFile(path) {
            const res = await fetch(`${API_BASE_URL}/api/files/read?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            editor.setValue(data.content);
            currentFilePath = path;
            
            // Set language based on extension
            const ext = path.split('.').pop();
            let lang = 'plaintext';
            if (ext === 'py') lang = 'python';
            else if (ext === 'md') lang = 'markdown';
            else if (ext === 'json') lang = 'json';
            
            monaco.editor.setModelLanguage(editor.getModel(), lang);
        }

        async function listDirectory(path) {
            const res = await fetch(`${API_BASE_URL}/api/files?path=${encodeURIComponent(path)}`);
            const files = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            files.forEach(file => {
                const item = document.createElement('div');
                const isDir = file.endsWith('/');
                item.className = `flex items-center space-x-2 px-2 py-1.5 rounded text-sm cursor-pointer hover:bg-slate-700 transition ${isDir ? 'text-slate-400' : 'text-slate-300'}`;
                item.innerHTML = `<i data-lucide="${isDir ? 'folder' : 'file-text'}" class="w-4 h-4"></i><span>${file}</span>`;
                if (!isDir) {
                    item.onclick = () => loadFile(file);
                } else {
                    item.onclick = () => listDirectory(file);
                }
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        async function saveFile() {
            if (!currentFilePath) return;
            const content = editor.getValue();
            const res = await fetch(`${API_BASE_URL}/api/files/write`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentFilePath, content })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';

            const res = await fetch(`${API_BASE_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            addMessage('senpai', data.content);
        }

        function addMessage(role, content) {
            const container = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = `p-3 rounded-lg text-sm ${role === 'user' ? 'message-user ml-8' : 'message-senpai mr-8'}`;
            msg.innerHTML = `<p>${content.replace(/\n/g, '<br>')}</p>`;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            if (confirm("Reset the session, Daddy?")) {
                // Implement reset API call if needed
                document.getElementById('chat-messages').innerHTML = '';
                addMessage('senpai', "Session cleared. Let's start fresh, Daddy. Mmmh~");
            }
        }

        document.getElementById('save-btn').onclick = saveFile;
        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('chat-input').onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        fetchConfig();
        refreshFiles();
    </script>
</body>
</html>
